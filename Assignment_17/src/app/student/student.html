<div class="page-wrapper">
  <header class="app-header">
    <h1>Student Portal</h1>
  </header>

  <main class="content-area">
    <div class="card">
      <div class="profile-section">
        <img [src]="imageUrl" alt="Profile" class="avatar">
        <div class="info">
          <h2 class="name">{{ name }}</h2>
          <p class="age">Age: <span>{{ age }}</span></p>
        </div>
      </div>

      <div class="interactive-section">
        <button class="glow-btn" (click)="showMessage()">Button</button>
        <p class="status-msg">{{ message }}</p>

        <div class="update-box">
          <input type="text" [(ngModel)]="name" class="modern-input" placeholder="Enter new name...">
        </div>
      </div>
    </div>
  </main>
</div>
