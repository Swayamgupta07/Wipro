<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h3 class="text-center mb-4">Login</h3>
        
        <div *ngIf="message" class="alert alert-danger">
          {{ message }}
        </div>

        <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" name="email" [(ngModel)]="credentials.email" required email>
          </div>

          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" name="password" [(ngModel)]="credentials.password" required>
          </div>

          <button type="submit" class="btn btn-primary w-100" [disabled]="!loginForm.form.valid">
            Login
          </button>
        </form>

        <div class="text-center mt-3">
          <p>Don't have an account? <a routerLink="/register">Register here</a></p>
        </div>
      </div>
    </div>
  </div>
</div>
