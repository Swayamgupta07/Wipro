<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student API Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4 dashboard-header p-3 rounded-4 shadow-sm">
            <h2 class="m-0 text-white"><i class="bi bi-mortarboard-fill me-2"></i> Student Directory</h2>
            <button class="btn btn-light text-primary fw-bold px-4 rounded-pill shadow-sm" onclick="showAddForm()">
                <i class="bi bi-person-plus-fill me-1"></i> Add Student
            </button>
        </div>

        <div id="alertBox" class="alert d-none shadow-sm" role="alert"></div>

        <div class="card shadow-sm border-0 rounded-4 overflow-hidden">
            <div class="card-body p-0">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="ps-4">Roll No</th>
                            <th>Name</th>
                            <th>Course</th>
                            <th>Email</th>
                            <th>City</th>
                            <th class="text-end pe-4">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="studentTableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal fade" id="studentModal" tabindex="-1" aria-labelledby="studentModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg rounded-4">
                <div class="modal-header border-bottom-0 pb-0">
                    <h5 class="modal-title fw-bold" id="studentModalLabel">Add New Student</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="studentForm">
                        <input type="hidden" id="studentId">
                        <input type="hidden" id="formMode" value="add">
                        
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">Full Name</label>
                            <input type="text" class="form-control bg-light border-0" id="name" required placeholder="e.g. Swayam Gupta">
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label text-muted small fw-bold">Roll No</label>
                                <input type="number" class="form-control bg-light border-0" id="rollno" required placeholder="e.g. 101">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label text-muted small fw-bold">Age</label>
                                <input type="number" class="form-control bg-light border-0" id="age" required min="16" placeholder="e.g. 21">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">Course / Program</label>
                            <select class="form-select bg-light border-0" id="course" required>
                                <option value="" disabled selected>--Select course--</option>
                                <option value="Computer Science">Computer Science</option>
                                <option value="BCA">BCA</option>
                                <option value="Computer Science with IT">Computer Science with IT</option>
                            </select>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">Email Address</label>
                            <input type="email" class="form-control bg-light border-0" id="email" required placeholder="e.g. swayamgupta@gmail.com">
                        </div>
                        
                        <div class="mb-4">
                            <label class="form-label text-muted small fw-bold">City</label>
                            <input type="text" class="form-control bg-light border-0" id="city" required placeholder="e.g. Kanpur">
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg rounded-pill shadow-sm" id="saveBtn">
                                Save Student
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
