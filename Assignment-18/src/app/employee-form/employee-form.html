<div class="card mb-4 shadow-sm border-0">
  <div class="card-header bg-primary text-white">
    <h5 class="mb-0">{{ isEditMode ? 'Edit Employee Details' : 'Add New Employee' }}</h5>
  </div>
  <div class="card-body bg-white">
    <form (ngSubmit)="saveEmployee()" #empForm="ngForm">

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label fw-bold">Name</label>
          <input type="text" class="form-control" name="name"
                 [(ngModel)]="employee.name"
                 #nameCtrl="ngModel"
                 required pattern="^[a-zA-Z ]+$" minlength="3">

          <div *ngIf="nameCtrl.invalid && (nameCtrl.dirty || nameCtrl.touched)" class="text-danger small mt-1 fw-bold">
            <span *ngIf="nameCtrl.errors?.['required']">Name is required.</span>
            <span *ngIf="nameCtrl.errors?.['pattern']">Only alphabets are allowed (no numbers).</span>
            <span *ngIf="nameCtrl.errors?.['minlength']">Name must be at least 3 characters.</span>
          </div>
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label fw-bold">Email</label>
          <input type="email" class="form-control" name="email"
                 [(ngModel)]="employee.email"
                 #emailCtrl="ngModel"
                 required email>

          <div *ngIf="emailCtrl.invalid && (emailCtrl.dirty || emailCtrl.touched)" class="text-danger small mt-1 fw-bold">
            <span *ngIf="emailCtrl.errors?.['required']">Email is required.</span>
            <span *ngIf="emailCtrl.errors?.['email']">Please enter a valid email address.</span>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label fw-bold">Department</label>
          <select class="form-select" name="department"
                  [(ngModel)]="employee.department"
                  #deptCtrl="ngModel" required>
            <option value="" disabled>Select Department</option>
            <option value="IT">IT</option>
            <option value="HR">HR</option>
            <option value="Engineering">Engineering</option>
            <option value="Sales">Sales</option>
          </select>

          <div *ngIf="deptCtrl.invalid && (deptCtrl.dirty || deptCtrl.touched)" class="text-danger small mt-1 fw-bold">
            <span *ngIf="deptCtrl.errors?.['required']">Please select a department.</span>
          </div>
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label fw-bold">Salary (₹)</label>
          <input type="number" class="form-control" name="salary"
                 [(ngModel)]="employee.salary"
                 #salaryCtrl="ngModel"
                 required min="1000">

          <div *ngIf="salaryCtrl.invalid && (salaryCtrl.dirty || salaryCtrl.touched)" class="text-danger small mt-1 fw-bold">
            <span *ngIf="salaryCtrl.errors?.['required']">Salary is required.</span>
            <span *ngIf="salaryCtrl.errors?.['min']">Salary must be at least ₹1,000.</span>
          </div>
        </div>
      </div>

      <div class="mt-2">
        <button type="submit" class="btn btn-success me-2 px-4" [disabled]="!empForm.valid">
          {{ isEditMode ? 'Update Employee' : 'Add Employee' }}
        </button>

        <button type="button" class="btn btn-secondary px-4" (click)="resetForm()">
          Clear
        </button>
      </div>

    </form>
  </div>
</div>
